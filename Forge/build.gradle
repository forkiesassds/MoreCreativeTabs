archivesBaseName = "${mod_name.replace(" ", "")}-Forge-${minecraft_version}"

dependencies {
    // Do not edit or remove
    implementation project(":Common")
}

unimined.minecraft {
    minecraftForge {
        loader forge_version
        mixinConfig("${mod_id}.mixin.json", "${mod_id}.forge.mixin.json")
    }
}

processResources {
    from project(":Common").sourceSets.main.resources
    def buildProps = project.properties.clone()

    filesMatching("META-INF/mods.toml") {
        expand buildProps
    }
}

compileTestJava.enabled = false
preRunClient.enabled = false

tasks.withType(JavaCompile).configureEach {
    source(project(":Common").sourceSets.main.allSource)
}

publisher {
    apiKeys {
        modrinth(System.getenv("MODRINTH_TOKEN"))
        curseforge(System.getenv("CURSE_TOKEN"))
        nightbloom(System.getenv("PLATFORM_KEY"))
    }

    setCurseID(curse_id)
    setModrinthID(modrinth_id)
    setNightbloomID("morecreativetabs")
    setVersionType("release")
    setChangelog("https://raw.githubusercontent.com/hypherionmc/changelogs/main/mct/changelog-forge.md")
    setProjectVersion("${minecraft_version}-${project.version}")
    setDisplayName("[FORGE 1.20/1] CraterLib - ${project.version}")
    setGameVersions("1.20", "1.20.1")
    setLoaders("forge")
    setArtifact(remapJar)
    setCurseEnvironment("client")

    modrinthDepends {
        required("fabric-api")
    }

    curseDepends {
        required("fabric-api")
    }
}